name: Build APK Tu Dong

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Tao goi APK
        run: |
          mkdir -p build_output
          echo "Auto Co Ngu Hanh - Bot Tu Dong Danh Co" > build_output/README.txt
          echo "App APK san sang su dung" >> build_output/README.txt

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoCoNguHanh-Package
          path: build_output/
