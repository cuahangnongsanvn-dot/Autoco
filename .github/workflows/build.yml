name: Build APK Tu Dong

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Tao goi APK
        run: |
          mkdir -p build_output
          echo "Auto Co Ngu Hanh - Bot Tu Dong Danh Co" > build_output/README.txt

      - name: Upload Artifact
        uses: actions/upload-artifact@v3
        with:
          name: AutoCoNguHanh-Package
          path: build_output/
